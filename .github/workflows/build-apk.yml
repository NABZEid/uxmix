name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK (Flutter stable)
        id: b1
        continue-on-error: true
        run: bash .github/build_apk.sh

      - name: Pasang Flutter 3.41 (cadangan)
        if: steps.b1.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: false

      - name: Build APK (Flutter 3.41)
        id: b2
        if: steps.b1.outcome == 'failure'
        continue-on-error: true
        run: bash .github/build_apk.sh

      - name: Pasang Flutter 3.27 (cadangan terakhir)
        if: steps.b1.outcome == 'failure' && steps.b2.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.x'
          cache: false

      - name: Build APK (Flutter 3.27)
        id: b3
        if: steps.b1.outcome == 'failure' && steps.b2.outcome == 'failure'
        run: bash .github/build_apk.sh

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxMix-apk
          path: UxMix.apk
          if-no-files-found: error

      - name: Terbitkan APK di Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.run_number }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" UxMix.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "UxMix APK #${{ github.run_number }}" \
            --notes "Dibangun otomatis dari commit ${GITHUB_SHA::7}."
